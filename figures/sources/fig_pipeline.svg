<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" font-family="'Noto Sans CJK KR','Noto Sans KR','NanumGothic','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8980"/>
    </marker>
  </defs>
  <rect width="1040" height="860" fill="#ffffff"/>

  <!-- legend -->
  <g transform="translate(700,18)">
    <rect x="0" y="0" width="292" height="40" rx="6" fill="#ffffff" stroke="#e2e1db"/>
    <rect x="14" y="16" width="13" height="10" rx="2" fill="#2a78d6"/>
    <path d="M17 16 v-3.5 a3.8 3.8 0 0 1 7.6 0 v3.5" fill="none" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="34" y="25" font-size="12" fill="#52514e">고정 (학습하지 않음)</text>
    <path d="M178 12 l6.5 6.5 l-13 13 l-7.5 1 l1 -7.5 z" fill="#eb6834"/>
    <text x="194" y="25" font-size="12" fill="#52514e">여기서 학습</text>
  </g>

  <!-- 1 data -->
  <text x="48" y="46" font-size="12.5" font-weight="700" fill="#8a8980">1 — 데이터</text>
  <rect x="48" y="66" width="944" height="72" rx="9" fill="#ffffff" stroke="#c9c9ce" stroke-width="1.6"/>
  <text x="70" y="94" font-size="15" font-weight="700" fill="#0b0b0b">UniProt / Swiss-Prot (릴리스 2026_04)</text>
  <text x="70" y="118" font-size="12.5" fill="#52514e">검수 항목만 · EC 번호 1개 · 길이 100–1000 · 조각 서열 제외 · 표준 아미노산만</text>
  <rect x="762" y="80" width="208" height="44" rx="6" fill="#f4f4f5"/>
  <text x="866" y="100" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">서열 7,000개</text>
  <text x="866" y="116" font-size="12" fill="#52514e" text-anchor="middle">EC 클래스 7개 × 1,000개</text>
  <line x1="520" y1="138" x2="520" y2="166" stroke="#8a8980" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- 2 predictors -->
  <text x="48" y="190" font-size="12.5" font-weight="700" fill="#8a8980">2 — 예측 방법 (비교 대상)</text>

  <rect x="48" y="202" width="224" height="118" rx="9" fill="#f6f6f5" stroke="#b4b3ad" stroke-width="1.6"/>
  <text x="64" y="228" font-size="14.5" font-weight="700" fill="#0b0b0b">A · 아미노산 조성</text>
  <text x="64" y="250" font-size="12" fill="#52514e">20종 아미노산의 비율</text>
  <text x="64" y="268" font-size="12" fill="#52514e">순서 정보 없음 (기준선)</text>
  <rect x="64" y="284" width="76" height="22" rx="11" fill="#e8e8e6"/>
  <text x="102" y="299" font-size="11.5" font-weight="700" fill="#44443f" text-anchor="middle">20차원</text>

  <rect x="288" y="202" width="224" height="118" rx="9" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.8"/>
  <rect x="482" y="216" width="13" height="10" rx="2" fill="#2a78d6"/>
  <path d="M485 216 v-3.5 a3.8 3.8 0 0 1 7.6 0 v3.5" fill="none" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="304" y="228" font-size="14.5" font-weight="700" fill="#1f4e9c">B · ESM-2 8M</text>
  <text x="304" y="250" font-size="12" fill="#2a5aa8">6층 · 파라미터 750만</text>
  <text x="304" y="268" font-size="12" fill="#2a5aa8">마지막 은닉층 평균 풀링</text>
  <rect x="304" y="284" width="84" height="22" rx="11" fill="#d7e4f7"/>
  <text x="346" y="299" font-size="11.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">320차원</text>

  <rect x="528" y="202" width="224" height="118" rx="9" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.8"/>
  <rect x="722" y="216" width="13" height="10" rx="2" fill="#2a78d6"/>
  <path d="M725 216 v-3.5 a3.8 3.8 0 0 1 7.6 0 v3.5" fill="none" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="544" y="228" font-size="14.5" font-weight="700" fill="#1f4e9c">C · ESM-2 650M</text>
  <text x="544" y="250" font-size="12" fill="#2a5aa8">33층 · 파라미터 6.5억</text>
  <text x="544" y="268" font-size="12" fill="#2a5aa8">마지막 은닉층 평균 풀링</text>
  <rect x="544" y="284" width="92" height="22" rx="11" fill="#d7e4f7"/>
  <text x="590" y="299" font-size="11.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">1,280차원</text>

  <rect x="768" y="202" width="224" height="118" rx="9" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.8"/>
  <text x="784" y="228" font-size="14.5" font-weight="700" fill="#0f7550">D · BLAST 최근접 이웃</text>
  <text x="784" y="250" font-size="12" fill="#1a7f5a">DIAMOND blastp, e ≤ 0.001</text>
  <text x="784" y="268" font-size="12" fill="#1a7f5a">가장 닮은 훈련 서열의 EC 복사</text>
  <text x="784" y="299" font-size="11.5" font-weight="700" fill="#0f7550">닮은 서열 없음 → 답 없음</text>

  <line x1="520" y1="320" x2="520" y2="348" stroke="#8a8980" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- 3 splits -->
  <text x="48" y="372" font-size="12.5" font-weight="700" fill="#8a8980">3 — 데이터 분할 (실험 변수) · 모든 방법이 동일한 분할 사용</text>
  <rect x="48" y="384" width="944" height="150" rx="9" fill="#ffffff" stroke="#c9c9ce" stroke-width="1.6"/>

  <rect x="70" y="404" width="172" height="110" rx="7" fill="#fdf3f0" stroke="#c75b39" stroke-width="1.6"/>
  <text x="156" y="428" font-size="14" font-weight="700" fill="#a0360e" text-anchor="middle">무작위 분할</text>
  <text x="156" y="452" font-size="11.5" fill="#7a4030" text-anchor="middle">낱개로 섞어 5등분</text>
  <text x="156" y="470" font-size="11.5" fill="#7a4030" text-anchor="middle">가까운 상동체가 양쪽에 걸침</text>
  <text x="156" y="502" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">최대 J = 0.987</text>

  <text x="258" y="466" font-size="20" fill="#b4b3ad">→</text>

  <g font-size="11.5">
    <rect x="290" y="404" width="160" height="110" rx="7" fill="#eef4fb" stroke="#2f6fc4" stroke-width="1.6"/>
    <text x="370" y="428" font-size="13.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">클러스터 J &lt; 0.30</text>
    <text x="370" y="452" fill="#2a5080" text-anchor="middle">클러스터 5,503개</text>
    <text x="370" y="470" fill="#2a5080" text-anchor="middle">유사쌍 5,186개</text>
    <text x="370" y="502" font-size="12" font-weight="700" fill="#1f4e9c" text-anchor="middle">최대 J = 0.299</text>

    <rect x="462" y="404" width="160" height="110" rx="7" fill="#eef4fb" stroke="#2f6fc4" stroke-width="1.6"/>
    <text x="542" y="428" font-size="13.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">클러스터 J &lt; 0.20</text>
    <text x="542" y="452" fill="#2a5080" text-anchor="middle">클러스터 5,098개</text>
    <text x="542" y="470" fill="#2a5080" text-anchor="middle">유사쌍 7,506개</text>
    <text x="542" y="502" font-size="12" font-weight="700" fill="#1f4e9c" text-anchor="middle">최대 J = 0.199</text>

    <rect x="634" y="404" width="160" height="110" rx="7" fill="#eef4fb" stroke="#2f6fc4" stroke-width="1.6"/>
    <text x="714" y="428" font-size="13.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">클러스터 J &lt; 0.10</text>
    <text x="714" y="452" fill="#2a5080" text-anchor="middle">클러스터 4,337개</text>
    <text x="714" y="470" fill="#2a5080" text-anchor="middle">유사쌍 21,364개</text>
    <text x="714" y="502" font-size="12" font-weight="700" fill="#1f4e9c" text-anchor="middle">최대 J = 0.100</text>

    <rect x="806" y="404" width="164" height="110" rx="7" fill="#eef4fb" stroke="#2f6fc4" stroke-width="1.6"/>
    <text x="888" y="428" font-size="13.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">클러스터 J &lt; 0.05</text>
    <text x="888" y="452" fill="#2a5080" text-anchor="middle">클러스터 3,580개</text>
    <text x="888" y="470" fill="#2a5080" text-anchor="middle">유사쌍 43,453개</text>
    <text x="888" y="502" font-size="12" font-weight="700" fill="#1f4e9c" text-anchor="middle">최대 J = 0.050</text>
  </g>

  <text x="48" y="556" font-size="12" fill="#8a8980">클러스터 = 4-mer Jaccard 유사도(J)가 기준치 이상인 모든 쌍을 이은 그래프의 연결 요소. 한 클러스터는 통째로 한쪽에만 배치.</text>
  <text x="48" y="574" font-size="12" fill="#8a8980">최대 J = 분할 후 실제로 측정한 훈련–테스트 간 최대 유사도 (누출 검증).</text>

  <line x1="520" y1="584" x2="520" y2="612" stroke="#8a8980" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- 4 classifier / prediction -->
  <text x="48" y="636" font-size="12.5" font-weight="700" fill="#8a8980">4 — 분류</text>
  <rect x="48" y="648" width="596" height="92" rx="9" fill="#fdf0e6" stroke="#d2691e" stroke-width="1.8"/>
  <path d="M74 668 l6.5 6.5 l-13 13 l-7.5 1 l1 -7.5 z" fill="#d2691e"/>
  <text x="98" y="676" font-size="14.5" font-weight="700" fill="#a0480e">A · B · C: 다항 로지스틱 회귀</text>
  <text x="98" y="699" font-size="12" fill="#a0480e">세 방법 모두 동일 설정 · 입력 표준화 · 클래스 가중치 균형</text>
  <text x="98" y="718" font-size="12" fill="#a0480e">분할 5종 × 5-fold마다 새로 학습 (3 × 5 × 5 = 75회)</text>

  <rect x="660" y="648" width="332" height="92" rx="9" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.8"/>
  <text x="678" y="676" font-size="14.5" font-weight="700" fill="#0f7550">D: 학습 없음 (라벨 복사)</text>
  <text x="678" y="699" font-size="12" fill="#1a7f5a">하이브리드 D+C:</text>
  <text x="678" y="718" font-size="12" fill="#1a7f5a">BLAST가 답하면 D, 답이 없으면 C</text>

  <line x1="520" y1="740" x2="520" y2="768" stroke="#8a8980" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- 5 evaluation -->
  <rect x="48" y="776" width="944" height="62" rx="8" fill="#ffffff" stroke="#c9c9ce" stroke-width="1.6"/>
  <text x="70" y="802" font-size="13.5" font-weight="700" fill="#0b0b0b">5 — 평가</text>
  <text x="70" y="824" font-size="12.5" fill="#52514e">macro-F1 (7개 클래스) · 5-fold 교차검증 · 서열 가족 단위 부트스트랩 2,000회 · 분할 시드 10회 반복 · 라벨 셔플 대조군</text>
</svg>
