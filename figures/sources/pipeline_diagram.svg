<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1a1a1a">이번 실험에서 실제로 훈련한 것은 무엇인가</text>
  <line x1="40" y1="68" x2="960" y2="68" stroke="#d8d8d8" stroke-width="1"/>

  <!-- ===== SECTION 1 : PIPELINE ===== -->
  <text x="40" y="106" font-size="15" font-weight="700" fill="#555">1. 전체 흐름</text>

  <!-- input -->
  <rect x="40" y="126" width="150" height="86" rx="8" fill="#f4f4f5" stroke="#c9c9ce" stroke-width="1.5"/>
  <text x="115" y="156" font-size="13" font-weight="600" fill="#333" text-anchor="middle">단백질 서열</text>
  <text x="115" y="180" font-size="12" fill="#777" text-anchor="middle" font-family="monospace">MKTAYIAK</text>
  <text x="115" y="197" font-size="12" fill="#777" text-anchor="middle" font-family="monospace">QRQISFVK...</text>

  <path d="M196 169 L232 169" stroke="#999" stroke-width="2"/>
  <path d="M232 169 l-8 -5 l0 10 z" fill="#999"/>

  <!-- ESM-2 : frozen -->
  <rect x="240" y="116" width="230" height="106" rx="8" fill="#eaf1fb" stroke="#4a7fd4" stroke-width="2.5"/>
  <text x="355" y="145" font-size="15" font-weight="700" fill="#1f4e9c" text-anchor="middle">ESM-2</text>
  <text x="355" y="168" font-size="11.5" fill="#2a5aa8" text-anchor="middle">esm2_t6_8M_UR50D</text>
  <text x="355" y="191" font-size="12.5" font-weight="600" fill="#1f4e9c" text-anchor="middle">파라미터 750만 개</text>
  <text x="355" y="211" font-size="12.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">고정 — 전혀 건드리지 않음</text>
  <!-- lock icon -->
  <rect x="432" y="128" width="20" height="15" rx="2.5" fill="#1f4e9c"/>
  <path d="M436 128 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#1f4e9c" stroke-width="2.5"/>

  <path d="M476 169 L512 169" stroke="#999" stroke-width="2"/>
  <path d="M512 169 l-8 -5 l0 10 z" fill="#999"/>

  <!-- vector -->
  <rect x="520" y="126" width="140" height="86" rx="8" fill="#f4f4f5" stroke="#c9c9ce" stroke-width="1.5"/>
  <text x="590" y="156" font-size="13" font-weight="600" fill="#333" text-anchor="middle">숫자 320개</text>
  <text x="590" y="180" font-size="11.5" fill="#777" text-anchor="middle">[0.12, -0.88,</text>
  <text x="590" y="197" font-size="11.5" fill="#777" text-anchor="middle">0.41, ... ]</text>

  <path d="M666 169 L702 169" stroke="#999" stroke-width="2"/>
  <path d="M702 169 l-8 -5 l0 10 z" fill="#999"/>

  <!-- classifier : trained -->
  <rect x="710" y="116" width="200" height="106" rx="8" fill="#fdf0e6" stroke="#d2691e" stroke-width="2.5"/>
  <text x="810" y="145" font-size="15" font-weight="700" fill="#a0480e" text-anchor="middle">로지스틱 회귀</text>
  <text x="810" y="170" font-size="12.5" font-weight="600" fill="#a0480e" text-anchor="middle">파라미터 2,247개</text>
  <text x="810" y="194" font-size="12.5" font-weight="700" fill="#a0480e" text-anchor="middle">← 여기만 학습됨</text>
  <text x="810" y="213" font-size="11.5" fill="#b8651f" text-anchor="middle">7 × 320 + 7</text>
  <!-- pencil icon -->
  <path d="M874 130 l10 10 l-22 22 l-12 2 l2 -12 z" fill="#d2691e"/>

  <path d="M810 230 L810 258" stroke="#999" stroke-width="2"/>
  <path d="M810 258 l-5 -8 l10 0 z" fill="#999"/>

  <!-- output -->
  <rect x="686" y="266" width="248" height="52" rx="8" fill="#f4f4f5" stroke="#c9c9ce" stroke-width="1.5"/>
  <text x="810" y="289" font-size="13" font-weight="600" fill="#333" text-anchor="middle">7개 효소 클래스 중 하나</text>
  <text x="810" y="308" font-size="11.5" fill="#777" text-anchor="middle">EC1 산화환원 … EC7 운반</text>

  <!-- who made what -->
  <rect x="240" y="238" width="230" height="46" rx="6" fill="#ffffff" stroke="#4a7fd4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="355" y="257" font-size="12" font-weight="600" fill="#1f4e9c" text-anchor="middle">Meta가 미리 만들어 둔 것</text>
  <text x="355" y="275" font-size="11.5" fill="#4a7fd4" text-anchor="middle">수억 개 단백질로 사전훈련</text>

  <!-- ===== SECTION 2 : ANALOGY ===== -->
  <line x1="40" y1="348" x2="960" y2="348" stroke="#e8e8e8" stroke-width="1"/>
  <text x="40" y="384" font-size="15" font-weight="700" fill="#555">2. 비유로 보면</text>

  <rect x="40" y="402" width="430" height="150" rx="8" fill="#eaf1fb" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="62" y="430" font-size="14" font-weight="700" fill="#1f4e9c">경력 30년 감별사  =  ESM-2</text>
  <text x="62" y="458" font-size="12.5" fill="#333">단백질을 수억 개 봐 온 전문가입니다.</text>
  <text x="62" y="480" font-size="12.5" fill="#333">서열을 보여주면 특징을 320가지로</text>
  <text x="62" y="502" font-size="12.5" fill="#333">정리해 줍니다.</text>
  <text x="62" y="530" font-size="12.5" font-weight="700" fill="#1f4e9c">그는 아무것도 새로 배우지 않았습니다.</text>

  <rect x="530" y="402" width="430" height="150" rx="8" fill="#fdf0e6" stroke="#d2691e" stroke-width="1.5"/>
  <text x="552" y="430" font-size="14" font-weight="700" fill="#a0480e">신입 판정원  =  로지스틱 회귀</text>
  <text x="552" y="458" font-size="12.5" fill="#333">단백질은 전혀 모릅니다. 감별사가 준</text>
  <text x="552" y="480" font-size="12.5" fill="#333">320개 숫자만 보고 분류하는 요령을</text>
  <text x="552" y="502" font-size="12.5" fill="#333">배웠습니다.</text>
  <text x="552" y="530" font-size="12.5" font-weight="700" fill="#a0480e">배운 건 이 사람뿐입니다.</text>

  <!-- ===== SECTION 3 : 5-FOLD ===== -->
  <line x1="40" y1="580" x2="960" y2="580" stroke="#e8e8e8" stroke-width="1"/>
  <text x="40" y="616" font-size="15" font-weight="700" fill="#555">3. 사실은 판정원을 5명 따로 길렀습니다 (5-fold 교차검증)</text>

  <g font-size="11">
    <!-- fold rows -->
    <g>
      <rect x="40"  y="640" width="76" height="26" rx="4" fill="#fdf0e6" stroke="#d2691e" stroke-width="1.5"/>
      <rect x="120" y="640" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="200" y="640" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="280" y="640" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="360" y="640" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <text x="78" y="657" text-anchor="middle" fill="#a0480e" font-weight="700">시험</text>
      <text x="458" y="657" fill="#555">1번째 판정원</text>
    </g>
    <g>
      <rect x="40"  y="674" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="120" y="674" width="76" height="26" rx="4" fill="#fdf0e6" stroke="#d2691e" stroke-width="1.5"/>
      <rect x="200" y="674" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="280" y="674" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="360" y="674" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <text x="158" y="691" text-anchor="middle" fill="#a0480e" font-weight="700">시험</text>
      <text x="458" y="691" fill="#555">2번째 판정원</text>
    </g>
    <g>
      <rect x="40"  y="708" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="120" y="708" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="200" y="708" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="280" y="708" width="76" height="26" rx="4" fill="#f0f0f2" stroke="#c9c9ce"/>
      <rect x="360" y="708" width="76" height="26" rx="4" fill="#fdf0e6" stroke="#d2691e" stroke-width="1.5"/>
      <text x="398" y="725" text-anchor="middle" fill="#a0480e" font-weight="700">시험</text>
      <text x="458" y="725" fill="#555">5번째 판정원  (3·4번째 생략)</text>
    </g>
  </g>

  <text x="600" y="652" font-size="12.5" fill="#333">회색 = 가르치는 데 쓴 데이터</text>
  <text x="600" y="674" font-size="12.5" fill="#333">주황 = 처음 보는 데이터로 시험</text>
  <text x="600" y="700" font-size="12.5" font-weight="700" fill="#1a1a1a">보고한 0.448 은 다섯 번의 시험을</text>
  <text x="600" y="720" font-size="12.5" font-weight="700" fill="#1a1a1a">모두 합친 점수입니다.</text>
</svg>
